services:
  # ─── BACKEND (NESTJS) ──────────────────────────────────────────────────────
  backend:
    image: ghcr.io/thomasabraham1/faith-connect-backend:latest
    container_name: fc-backend
    restart: always
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_DB_URI=${MONGO_DB_URI}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SQS_QUEUE_NAME=${SQS_QUEUE_NAME}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL}
      - GOOGLE_APP_PASSWORD=${GOOGLE_APP_PASSWORD}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID}
      - AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM}
      - VITE_APP_API_URL=${VITE_APP_API_URL}
    volumes:
      - ./backend-data/uploads:/app/public/uploads
      - ./backend-data/signatures:/app/public/signatures

  # ─── FRONTEND (NGINX) ──────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/thomasabraham1/faith-connect-frontend:latest
    container_name: fc-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  # ─── CERTBOT (SSL GENERATOR) ────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: fc-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
